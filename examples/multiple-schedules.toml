version = 1

[schedules.default]
cron = "17 * * * *"
timezone = "UTC"

[schedules.nightly]
cron = "23 3 * * *"
timezone = "America/New_York"

[schedules.on-demand]
cron = "manual"
timezone = "UTC"

[[rules]]
id = "curator-releases"
enabled = false
source = "https://mdblist.com/lists/public-curator/releases"
destination = "https://trakt.tv/users/your-account/lists/releases"
direction = "source_to_destination"
deletion_policy = "additions_only"
profile = "default"

[[rules]]
id = "my-nightly-shows"
enabled = false
source = "https://mdblist.com/lists/your-account/shows"
destination = "https://trakt.tv/users/your-account/lists/shows"
direction = "source_to_destination"
deletion_policy = "mirror"
profile = "nightly"
max_delete_count = 50
max_delete_fraction = 0.25

[[rules]]
id = "trakt-to-mdblist-manual"
enabled = false
source = "https://mdblist.com/lists/your-account/static-archive"
destination = "https://trakt.tv/users/public-curator/lists/public-archive"
direction = "destination_to_source"
deletion_policy = "additions_only"
profile = "on-demand"