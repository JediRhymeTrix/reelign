<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Reelign — Your lists. Perfectly aligned.</title>
  <desc id="desc">MDBList and Trakt movie and show lists connect through your GitHub repository, using your own credentials.</desc>
  <rect width="1200" height="630" fill="#0b121b"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#111d2a" stroke="#304355" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <rect x="96" y="98" width="64" height="64" rx="16" fill="#82efc1"/>
    <text x="128" y="145" font-size="48" text-anchor="middle" fill="#0b121b">↔</text>
    <text x="180" y="149" font-size="56" font-weight="800" fill="#e8f0f6">Reelign</text>
    <text x="96" y="244" font-size="48" font-weight="700" fill="#82efc1">Your lists. Perfectly aligned.</text>
    <text x="98" y="298" font-size="25" fill="#b2c2d0">MDBList ↔ Trakt List Sync</text>
    <g fill="#0b121b" stroke="#304355" stroke-width="2">
      <rect x="98" y="364" width="230" height="82" rx="14"/>
      <rect x="448" y="364" width="302" height="82" rx="14"/>
      <rect x="870" y="364" width="230" height="82" rx="14"/>
    </g>
    <g fill="#e8f0f6" font-size="25" text-anchor="middle" font-weight="650">
      <text x="213" y="416">MDBList</text>
      <text x="599" y="416">Your repository</text>
      <text x="985" y="416">Trakt</text>
    </g>
    <g fill="#82efc1" font-size="52" text-anchor="middle">
      <text x="388" y="421">↔</text>
      <text x="810" y="421">↔</text>
    </g>
    <text x="98" y="518" font-size="22" fill="#b2c2d0">Own lists or public sources. Your credentials. Preview first.</text>
  </g>
</svg>