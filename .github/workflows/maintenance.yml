name: Maintain Trakt authorization

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    if: vars.REELIGN_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/reusable-sync.yml
    with:
      maintenance: true
    secrets: inherit