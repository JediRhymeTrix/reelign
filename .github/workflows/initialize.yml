name: Initialize sync state

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Create a NEW encrypted state branch (refuses existing state)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: reelign-state
  cancel-in-progress: false

jobs:
  initialize:
    if: inputs.confirm && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create encrypted orphan state branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRAKT_OAUTH_JSON: ${{ secrets.TRAKT_OAUTH_JSON }}
          SYNC_STATE_KEY: ${{ secrets.SYNC_STATE_KEY }}
        run: python manage.py init-state --repo "$REPO"